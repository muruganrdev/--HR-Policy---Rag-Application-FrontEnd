<aside class="app-sidebar">
  <div class="sidebar-block sidebar-actions">
    <button class="new-chat-btn" (click)="createNewChat()" title="Start a new chat">
      <span class="btn-icon">＋</span>
      <span>New Chat</span>
    </button>
  </div>

  <div class="sidebar-block">
    <div class="block-header">
      <span class="header-icon">💬</span>
      <h3 class="header-title">Conversations</h3>
    </div>

    <div class="conversation-list">
      @for (conversation of chatState.conversations(); track conversation.id) {
        <button
          class="conversation-tab"
          [class.active]="conversation.id === chatState.activeConversationId()"
          (click)="selectConversation(conversation.id)"
          type="button"
        >
          <span class="conversation-dot"></span>
          <span class="conversation-title">{{ conversation.title || 'New chat' }}</span>
        </button>
      }
    </div>
  </div>

  <div class="sidebar-block">
    <div class="block-header">
      <span class="header-icon">💡</span>
      <h3 class="header-title">Recommended Questions</h3>
    </div>

    <div class="quick-prompts-list">
      @for (question of recommendedQuestions; track question.label) {
        <button class="prompt-chip" (click)="selectSampleQuestion(question)" [disabled]="chatState.isLoading()" type="button">
          <span class="prompt-icon">{{ question.icon }}</span>
          <div class="prompt-meta">
            <span class="prompt-label">{{ question.label }}</span>
            <span class="prompt-query-preview">{{ question.query }}</span>
          </div>
        </button>
      }
    </div>
  </div>
</aside>
