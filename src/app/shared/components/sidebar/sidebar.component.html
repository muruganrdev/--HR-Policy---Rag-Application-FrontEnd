<aside class="app-sidebar">
  <!-- Actions Card -->
  <div class="sidebar-block">
    <button class="new-chat-btn" (click)="clearChat()" title="Start a new clear conversation">
      <span class="btn-icon">✨</span>
      <span>New Conversation</span>
    </button>
  </div>

  <!-- Suggested Questions Section -->
  <div class="sidebar-block">
    <div class="block-header">
      <span class="header-icon">💡</span>
      <h3 class="header-title">Quick Test Prompts</h3>
    </div>
    <div class="quick-prompts-list">
      @for (q of sampleQuestions; track q.label) {
        <button class="prompt-chip" (click)="selectSampleQuestion(q)" [disabled]="chatState.isLoading()">
          <span class="prompt-icon">{{ q.icon }}</span>
          <div class="prompt-meta">
            <span class="prompt-label">{{ q.label }}</span>
            <span class="prompt-query-preview">{{ q.query }}</span>
          </div>
        </button>
      }
    </div>
  </div>

  <!-- Indexed Policy PDFs -->
  <div class="sidebar-block">
    <div class="block-header">
      <span class="header-icon">📑</span>
      <h3 class="header-title">HR Knowledge Base (6 PDFs)</h3>
    </div>
    <div class="policy-pills">
      @for (doc of catalog; track doc.filename) {
        <a routerLink="/explorer" class="policy-mini-card">
          <div class="mini-card-head">
            <span class="doc-badge">PDF</span>
            <span class="doc-title">{{ doc.title }}</span>
          </div>
          <span class="doc-file">{{ doc.filename }}</span>
        </a>
      }
    </div>
  </div>
</aside>
