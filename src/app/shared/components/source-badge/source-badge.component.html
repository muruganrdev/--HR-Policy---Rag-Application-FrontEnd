<div class="source-badge" [title]="'Retrieved from ' + source.source + ' (Chunk ' + source.chunk + ')'">
  <span class="source-icon">{{ getDocumentIcon(source.source) }}</span>
  <span class="source-name">{{ getCleanFilename(source.source) }}</span>
  <span class="chunk-pill">Chunk {{ source.chunk }}</span>
</div>
